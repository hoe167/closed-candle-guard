[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "closed-candle-guard"
version = "0.1.0"
description = "Dependency-free validation of closed daily OHLCV candles for reproducible research"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Closed Candle Guard Contributors"}]
keywords = ["ohlcv", "candles", "backtesting", "look-ahead-bias", "validation"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Scientific/Engineering :: Information Analysis"]

[project.scripts]
closed-candle-guard = "closed_candle_guard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
